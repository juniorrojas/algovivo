name: demo

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
  push:
  pull_request:
    branches:
      - main

env:
  DEPLOY_DIRNAME: page.out
  DEMO_SRC_DIRNAME: ./demo
  DEMO_PUBLIC_DIRNAME: ./demo/public
  DEPLOY_LOCAL_SCRIPT: ./demo/scripts/deploy-local
  ENZYME_IMAGE: ghcr.io/juniorrojas/algovivo/llvm18-enzyme:latest

permissions:
  contents: read

jobs:
  build-wasm:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: Build WebAssembly
        run: |
          python codegen/codegen.py
          docker run \
            -v $(pwd):/workspace \
            -w /workspace \
            ${{ env.ENZYME_IMAGE }} \
            ./build.sh

      - name: Upload .wasm
        uses: actions/upload-artifact@v6
        with:
          name: algovivo.wasm
          path: build/algovivo.wasm
  build-js:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: Set up node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Codegen
        run: python codegen/codegen.py

      - name: Build lib
        run: |
          npm ci
          npm run build

      - name: Upload lib build
        uses: actions/upload-artifact@v6
        with:
          name: build
          path: ./build

  build-demo:
    runs-on: ubuntu-latest
    needs: [build-wasm, build-js]
    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: Download .wasm
        uses: actions/download-artifact@v7
        with:
          name: algovivo.wasm
          path: build/

      - name: Download JS build
        uses: actions/download-artifact@v7
        with:
          name: build
          path: ./build

      - name: Set up node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build demo
        run: |
          cd ${{ env.DEMO_SRC_DIRNAME }}
          npm ci
          npm run build

      - name: Upload demo build
        uses: actions/upload-artifact@v6
        with:
          name: demo-public
          path: ${{ env.DEMO_PUBLIC_DIRNAME }}

  test-demo:
    runs-on: ubuntu-latest
    needs: [build-demo]
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: List demo public dir before build
        run: ls -l ${{ env.DEMO_PUBLIC_DIRNAME }}

      - name: Download .wasm
        uses: actions/download-artifact@v7
        with:
          name: algovivo.wasm
          path: build/

      - name: Download JS build
        uses: actions/download-artifact@v7
        with:
          name: build
          path: ./build

      - name: Download demo build
        uses: actions/download-artifact@v7
        with:
          name: demo-public
          path: ${{ env.DEMO_PUBLIC_DIRNAME }}

      - name: List demo public dir after build
        run: ls -l ${{ env.DEMO_PUBLIC_DIRNAME }}

      - name: Set up node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test demo
        run: |
          cd ${{ env.DEMO_SRC_DIRNAME }}
          npm ci
          npm test

      - name: Upload demo screenshot
        uses: actions/upload-artifact@v6
        with:
          name: screenshot
          path: ./demo/test/screenshot.out.png

  make-page:
    runs-on: ubuntu-latest
    needs: [build-demo]
    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: List demo public dir
        run: ls -l ${{ env.DEMO_PUBLIC_DIRNAME }}

      - name: Download .wasm
        uses: actions/download-artifact@v7
        with:
          name: algovivo.wasm
          path: build/

      - name: Download demo build
        uses: actions/download-artifact@v7
        with:
          name: demo-public
          path: ${{ env.DEMO_PUBLIC_DIRNAME }}

      - name: List demo public dir
        run: ls -l ${{ env.DEMO_PUBLIC_DIRNAME }}

      - name: Deploy to local directory
        run: |
          ${{ env.DEPLOY_LOCAL_SCRIPT }} --deploy-dirname ${{ env.DEPLOY_DIRNAME }}

      - name: Upload deployment
        uses: actions/upload-pages-artifact@v4
        with:
          name: page
          path: ${{ env.DEPLOY_DIRNAME }}

  deploy-demo:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    needs: [make-page, test-demo]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: page
