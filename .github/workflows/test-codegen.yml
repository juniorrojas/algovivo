name: test-codegen

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ENZYME_IMAGE: ghcr.io/juniorrojas/algovivo/llvm18-enzyme:latest

jobs:
  test-codegen:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: Test
        run: |
          docker run \
            -v $(pwd):/workspace \
            -w /workspace \
            ${{ env.ENZYME_IMAGE }} \
            bash -c '
              apt-get update && apt-get install -y python3-pytest &&
              export PATH=$LLVM_BIN_DIR:$PATH &&
              export PYTHONPATH=./codegen &&
              python3 -m pytest -s ./codegen/test
            '
