<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Palanquin" rel="stylesheet">
  <link rel="icon" type="image/png" href="icons/icon.png">
  <title>algovivo</title>
  <meta name="description" content="an energy-based formulation for soft-bodied virtual creatures">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://juniorrojas.com/algovivo">
  <meta property="og:title" content="algovivo">
  <meta property="og:description" content="an energy-based formulation for soft-bodied virtual creatures">
  <meta property="og:image" content="https://juniorrojas.com/algovivo/img/quadruped.png">
  <meta property="og:image:width" content="640">
  <meta property="og:image:height" content="320">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Palanquin";
      font-size: 18px;
    }

    html, body {
      width: 100%;
      background: #000;
    }

    p {
      margin-bottom: 10px;
      margin-top: 10px;
    }

    .code {
      border: 1px solid rgb(176, 176, 176);
      background-color: rgb(42 42 42);
      border-radius: 5px;
      padding: 3px;
      font-family: monospace;
      white-space: nowrap;
    }

    .code2 {
      border: 1px solid rgb(176, 176, 176);
      background-color: rgb(237 237 237);
      border-radius: 5px;
      padding: 3px;
      font-family: monospace;
      white-space: nowrap;
    }

    .a2 {
      color: black;
      text-decoration: underline;
    }

    li {
      list-style-position: inside;
    }

    a {
      color: white;
    }

    #app {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .site-header {
      width: 100%;
      background: #000;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      padding: 0 26px 44px;
      text-align: center;
    }

    .header-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: #000;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .header-nav.scrolled {
      border-bottom-color: #222;
    }

    .header-nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 26px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-title {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      margin-right: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .header-nav.scrolled .nav-title {
      opacity: 1;
      pointer-events: auto;
    }

    .header-github {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      border: 1px solid #3a3a3a;
      border-radius: 999px;
      padding: 5px 14px;
    }

    .header-github span {
      font-size: 14px;
    }

    .site-header h1 {
      font-size: 33px;
      color: white;
    }

    .site-header p {
      font-size: 18px;
      color: #c7c7c7;
      margin: 0;
      text-wrap: balance;
    }

    .site-footer {
      width: 100%;
      background: #000;
      border-top: 1px solid #222;
    }

    .footer-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 26px;
      display: flex;
      align-items: center;
    }

    .footer-brand {
      color: white;
      font-weight: 600;
      font-size: 14px;
      margin-right: auto;
    }

    .footer-link {
      color: #9a9a9a;
      text-decoration: none;
      font-size: 14px;
    }

    .footer-link:hover {
      color: white;
    }

    .more-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .more-card {
      display: flex;
      flex-direction: column;
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      overflow: hidden;
      background: white;
      color: #666;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }

    .more-card:hover {
      transform: translateY(-2px);
      border-color: #d0d0d0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .more-card img {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 1;
      object-fit: cover;
      border-bottom: 1px solid #eee;
    }

    .more-body {
      padding: 14px 16px 16px;
    }

    .more-title {
      color: black;
      font-weight: 600;
      font-size: 17px;
      line-height: 1.3;
    }

    .more-text {
      font-size: 14px;
      line-height: 1.45;
      margin-top: 4px;
    }

    @media (max-width: 640px) {
      .header-nav-inner {
        padding: 14px 16px;
      }

      .site-header {
        padding: 0 16px 28px;
      }

      .footer-bar {
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (async () => {
      let src = "main.build.js";
      try {
        const res = await fetch("release.build.json?t=" + Date.now());
        if (res.ok) {
          const { id } = await res.json();
          if (id) src = "main.build.js?v=" + encodeURIComponent(id);
        }
      } catch (e) {}
      const script = document.createElement("script");
      script.type = "module";
      script.src = src;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
